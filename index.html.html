<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Manual para Aprender Inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light;
    --paper:#FBF6EA;
    --paper-line:#E4DAC4;
    --ink:#1E2A54;
    --ink-soft:#3B4A7A;
    --red:#B23A2E;
    --red-soft:#D9645A;
    --highlight:#FFE07D;
    --graphite:#2B2A28;
    --muted:#8A8371;
    --card:#FFFFFF;
    --ring:#C9BF9E;
    --green:#2F6B4F;
    /* menú lateral: vino + gris */
    --wine:#3E1620;
    --wine-deep:#2C0F17;
    --wine-line:#5C2732;
    --gray-text:#C9C2BE;
    --gray-text-soft:#9A928D;
    --rose:#C7626B;
  }
  *{box-sizing:border-box;}
  html{ scroll-behavior:smooth; background:var(--paper); color-scheme:light; }
  body{
    margin:0;
    font-family:'Literata', serif;
    background:var(--paper);
    color:var(--graphite);
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--highlight); }

  /* ---------- layout shell ---------- */
  .shell{
    display:flex;
    min-height:100vh;
  }

  /* ---------- sidebar (binder tabs) — paleta vino + gris ---------- */
  .sidebar{
    width:270px;
    flex-shrink:0;
    background:linear-gradient(180deg, var(--wine) 0%, var(--wine-deep) 100%);
    color:var(--gray-text);
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
    padding:28px 0 28px 0;
    z-index:20;
  }
  .brand{
    font-family:'Caveat', cursive;
    font-size:2rem;
    font-weight:700;
    padding:0 24px 18px 24px;
    border-bottom:1px dashed rgba(201,194,190,0.25);
    margin-bottom:10px;
    line-height:1.1;
    color:#F1EAE7;
  }
  .brand span{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.65rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--rose);
    margin-top:4px;
    font-weight:600;
  }
  .level-nav{
    list-style:none;
    margin:0;
    padding:10px 0;
  }
  .level-nav li{ position:relative; }
  .level-nav button{
    all:unset;
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:13px 24px;
    cursor:pointer;
    font-family:'Literata', serif;
    font-size:0.93rem;
    font-weight:500;
    color:var(--gray-text);
    border-left:3px solid transparent;
    transition:background .18s ease, color .18s ease, border-color .18s ease;
  }
  .level-nav button:hover{
    background:rgba(201,194,190,0.08);
    color:#fff;
  }
  .level-nav li.active button{
    background:var(--paper);
    color:var(--wine);
    border-left:3px solid var(--rose);
    font-weight:600;
  }
  .lvl-num{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:rgba(201,194,190,0.14);
    color:var(--gray-text);
    flex-shrink:0;
  }
  .level-nav li.active .lvl-num{
    background:var(--rose);
    color:#fff;
  }
  .sidebar-foot{
    padding:18px 24px 0 24px;
    font-size:0.72rem;
    color:var(--gray-text-soft);
    font-family:'JetBrains Mono', monospace;
    line-height:1.6;
  }

  /* ---------- main / notebook page ---------- */
  .main{
    flex:1;
    position:relative;
    min-width:0;
  }
  .rings{
    position:sticky;
    top:0;
    float:left;
    width:34px;
    height:0;
  }
  .page{
    max-width:900px;
    margin:0 auto;
    padding:48px 56px 120px 56px;
    position:relative;
    background:var(--paper);
  }

  .hero{
    padding-left:8px;
    margin-bottom:38px;
    padding-bottom:24px;
    border-bottom:1px solid var(--ring);
  }
  .hero .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--red);
    font-weight:600;
  }
  .hero h1{
    font-family:'Caveat', cursive;
    font-size:3.6rem;
    line-height:1;
    margin:8px 0 6px 0;
    color:var(--ink);
  }
  .hero p{
    max-width:60ch;
    font-size:1.02rem;
    color:var(--graphite);
    margin:0;
  }

  .topic{
    background:var(--card);
    border:1px solid var(--ring);
    border-radius:12px;
    margin:0 0 18px 0;
    box-shadow:0 2px 8px rgba(30,42,84,0.06);
    overflow:hidden;
  }
  .topic-head{
    all:unset;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 22px;
    cursor:pointer;
    background:var(--card);
  }
  .topic-head .dot{
    width:11px;height:11px;border-radius:50%;
    background:var(--ink);
    flex-shrink:0;
  }
  .topic-head h3{
    margin:0;
    font-family:'Literata', serif;
    font-weight:600;
    font-size:1.14rem;
    color:var(--ink);
    flex:1;
  }
  .topic-head .chev{
    font-family:'JetBrains Mono', monospace;
    color:var(--muted);
    transition:transform .25s ease;
    font-size:0.9rem;
  }
  .topic.open .topic-head .chev{ transform:rotate(90deg); color:var(--red); }
  .topic-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .35s ease;
    border-top:1px dashed var(--paper-line);
  }
  .topic.open .topic-body{ border-top:1px dashed var(--paper-line); }
  .topic-inner{
    padding:6px 22px 24px 22px;
  }

  h4.sub{
    font-size:0.95rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--red);
    font-weight:600;
    margin:20px 0 10px 0;
  }
  p{ line-height:1.65; }
  .note{
    background:#FFF8E6;
    border-left:3px solid var(--highlight);
    padding:10px 14px;
    font-size:0.92rem;
    border-radius:0 6px 6px 0;
    margin:12px 0;
  }
  .note b{ color:var(--red); }

  .eli5{
    background:#EAF4FF;
    border:1.5px dashed #8FB8E0;
    padding:12px 16px;
    font-size:0.96rem;
    border-radius:10px;
    margin:6px 0 18px 0;
    line-height:1.6;
  }
  .eli5 .tag{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:#2B6CB0;
    font-weight:700;
    margin-bottom:5px;
  }
  .eli5 b{ color:#2B6CB0; }

  table.gram{
    width:100%;
    border-collapse:collapse;
    margin:10px 0 18px 0;
    font-size:0.94rem;
  }
  table.gram th{
    text-align:left;
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--muted);
    border-bottom:2px solid var(--ink);
    padding:6px 10px;
  }
  table.gram td{
    padding:8px 10px;
    border-bottom:1px solid var(--paper-line);
  }
  table.gram td.en{ color:var(--ink); font-weight:600; }
  table.gram td.es{ color:var(--graphite); }
  table.gram tr:hover td{ background:#FFFBF0; }

  .chips{ display:flex; flex-wrap:wrap; gap:8px; margin:10px 0 18px 0; }
  .chip{
    background:var(--paper);
    border:1px solid var(--ring);
    border-radius:20px;
    padding:6px 14px;
    font-size:0.88rem;
    font-family:'JetBrains Mono', monospace;
  }
  .chip b{ color:var(--ink); font-family:'Literata', serif; }

  .ex{
    border-left:3px solid var(--ink);
    padding:4px 0 4px 14px;
    margin:8px 0;
    font-size:0.98rem;
  }
  .ex .en{ color:var(--ink); font-weight:600; }
  .ex .es{ color:var(--muted); font-size:0.88rem; }

  /* ---------- quiz ---------- */
  .quiz{
    margin-top:22px;
    background:var(--paper);
    border:1px dashed var(--ring);
    border-radius:12px;
    padding:18px 20px;
  }
  .quiz-title{
    font-family:'Caveat', cursive;
    font-size:1.5rem;
    color:var(--ink);
    margin:0 0 12px 0;
  }
  .q{ margin-bottom:16px; }
  .q p.stem{ margin:0 0 8px 0; font-weight:600; }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .opt{
    all:unset;
    cursor:pointer;
    padding:8px 14px;
    border-radius:8px;
    border:1.5px solid var(--ring);
    background:#fff;
    font-size:0.92rem;
    transition:transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .opt:hover{ border-color:var(--ink); }
  .opt.correct{
    background:#E6F3EC; border-color:var(--green); color:var(--green); font-weight:600;
    animation:pop .3s ease;
  }
  .opt.wrong{
    background:#FBEAE8; border-color:var(--red); color:var(--red);
    animation:shake .35s ease;
  }
  @keyframes pop{ 0%{transform:scale(1);} 50%{transform:scale(1.08);} 100%{transform:scale(1);} }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .quiz-result{
    margin-top:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
    color:var(--muted);
    transition:color .2s ease;
  }
  .quiz-result.good{ color:var(--green); font-weight:600; }
  .quiz-result.bad{ color:var(--red); font-weight:600; }

  .float-badge{
    position:absolute;
    top:-22px; right:-6px;
    font-size:1.3rem;
    pointer-events:none;
    animation:floatUp .9s ease forwards;
  }
  @keyframes floatUp{
    0%{ opacity:0; transform:translateY(0) scale(0.6) rotate(-8deg); }
    25%{ opacity:1; transform:translateY(-10px) scale(1.15) rotate(6deg); }
    70%{ opacity:1; transform:translateY(-22px) scale(1) rotate(-4deg); }
    100%{ opacity:0; transform:translateY(-34px) scale(0.9) rotate(0deg); }
  }

  /* fade-in on level switch */
  .level-panel{ display:none; animation:fadein .4s ease; }
  .level-panel.active{ display:block; }
  @keyframes fadein{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  @media (max-width:820px){
    .sidebar{ position:fixed; left:0; top:0; transform:translateX(-100%); transition:transform .25s ease; width:78%; max-width:300px; }
    .sidebar.open{ transform:translateX(0); }
    .menu-btn{
      position:fixed; top:14px; left:14px; z-index:30;
      background:var(--wine); color:#fff; border:none; border-radius:8px;
      width:42px; height:42px; font-size:1.2rem; cursor:pointer;
    }
    .page{ padding:80px 22px 100px 26px; }
    .hero h1{ font-size:2.6rem; }
  }
  .menu-btn{ display:none; }
  @media (max-width:820px){ .menu-btn{ display:block; } }

  a{ color:var(--ink); }
  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:var(--ring); border-radius:5px; }
</style>
</head>
<body>

<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>

<div class="shell">
  <nav class="sidebar">
    <div class="brand">Manual para<span>Aprender Inglés</span></div>
    <ul class="level-nav" id="levelNav"></ul>
    <div class="sidebar-foot">21 niveles · gramática, vocabulario y práctica.</div>
  </nav>

  <main class="main">
    <div class="page" id="page"></div>
  </main>
</div>

<script>
/* ================= LEVEL REGISTRY ================= */
/* cada nivel se agrega llamando LEVELS.push({id, title, eyebrow, intro, html}) */
window.LEVELS = [];
</script>

<!-- NIVEL 0 -->
<script>
LEVELS.push({
  title:"Cimientos",
  eyebrow:"Nivel 0 · Antes de las oraciones",
  intro:"Todo cuaderno empieza por aquí: cómo suenan las letras, cómo saludar, y las palabras pequeñas (a/an/the/this/that) que acompañan a cada sustantivo en inglés.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Abecedario y cómo deletrear tu nombre</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <p>Cada letra del inglés se pronuncia distinto a como suena en español. Esto es clave para deletrear (spell) tu nombre o cualquier palabra en voz alta.</p>
      <div class="eli5"><span class="tag">Explicación simple</span>Piensa en el abecedario en inglés como una canción nueva que tienes que aprender con otra melodía. No te preocupes si al principio suena raro — todos los que aprenden inglés pasan por esto. Practica en voz alta, letra por letra, como si cantaras el "ABC" en inglés.</div>
      <table class="gram">
        <tr><th>Letra</th><th>Se pronuncia</th><th>Letra</th><th>Se pronuncia</th></tr>
        <tr><td class="en">A</td><td class="es">ei</td><td class="en">N</td><td class="es">en</td></tr>
        <tr><td class="en">B</td><td class="es">bi</td><td class="en">O</td><td class="es">ou</td></tr>
        <tr><td class="en">C</td><td class="es">ci</td><td class="en">P</td><td class="es">pi</td></tr>
        <tr><td class="en">D</td><td class="es">di</td><td class="en">Q</td><td class="es">kiu</td></tr>
        <tr><td class="en">E</td><td class="es">i</td><td class="en">R</td><td class="es">ar</td></tr>
        <tr><td class="en">F</td><td class="es">ef</td><td class="en">S</td><td class="es">es</td></tr>
        <tr><td class="en">G</td><td class="es">yi</td><td class="en">T</td><td class="es">ti</td></tr>
        <tr><td class="en">H</td><td class="es">eich</td><td class="en">U</td><td class="es">iu</td></tr>
        <tr><td class="en">I</td><td class="es">ai</td><td class="en">V</td><td class="es">vi</td></tr>
        <tr><td class="en">J</td><td class="es">yei</td><td class="en">W</td><td class="es">dóblliu</td></tr>
        <tr><td class="en">K</td><td class="es">kei</td><td class="en">X</td><td class="es">ex</td></tr>
        <tr><td class="en">L</td><td class="es">el</td><td class="en">Y</td><td class="es">uai</td></tr>
        <tr><td class="en">M</td><td class="es">em</td><td class="en">Z</td><td class="es">zi</td></tr>
      </table>
      <div class="note"><b>Frase clave:</b> "How do you spell your name?" (¿Cómo deletreas tu nombre?) → respondes letra por letra en inglés. Ej: Yinette → uai-ai-en-i-ti-ti-i.</div>
      <div class="quiz">
        <p class="quiz-title">Practica rápido</p>
        <div class="q">
          <p class="stem">¿Cómo se pronuncia la letra "G"?</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,false,'r0a')">yi</button>
            <button class="opt" onclick="checkAnswer(this,true,'r0a')">yi (correcta: /yi/)</button>
          </div>
        </div>
        <p class="quiz-result" id="r0a"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Números</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <table class="gram">
        <tr><th>Número</th><th>Inglés</th><th>Número</th><th>Inglés</th></tr>
        <tr><td class="en">0</td><td class="es">zero</td><td class="en">20</td><td class="es">twenty</td></tr>
        <tr><td class="en">1</td><td class="es">one</td><td class="en">30</td><td class="es">thirty</td></tr>
        <tr><td class="en">2</td><td class="es">two</td><td class="en">40</td><td class="es">forty</td></tr>
        <tr><td class="en">3</td><td class="es">three</td><td class="en">50</td><td class="es">fifty</td></tr>
        <tr><td class="en">4</td><td class="es">four</td><td class="en">60</td><td class="es">sixty</td></tr>
        <tr><td class="en">5</td><td class="es">five</td><td class="en">70</td><td class="es">seventy</td></tr>
        <tr><td class="en">10</td><td class="es">ten</td><td class="en">80</td><td class="es">eighty</td></tr>
        <tr><td class="en">11-19</td><td class="es">eleven ... nineteen</td><td class="en">90</td><td class="es">ninety</td></tr>
        <tr><td class="en">100</td><td class="es">one hundred</td><td class="en">1000</td><td class="es">one thousand</td></tr>
      </table>
      <div class="note">Para combinar decenas: 24 = <b>twenty-four</b>, 35 = <b>thirty-five</b>.</div>
      <div class="ex"><div class="en">How old are you? — I am twenty-five years old.</div></div>
      <div class="ex"><div class="en">What's your phone number? — It's 0414-9631359.</div></div>
      <div class="ex"><div class="en">How many students are there? — There are thirty-two.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Escribe 47 en inglés</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r0n')">forty-seven</button>
            <button class="opt" onclick="checkAnswer(this,false,'r0n')">fourty-seven</button>
          </div>
        </div>
        <p class="quiz-result" id="r0n"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Saludos y despedidas</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <h4 class="sub">Saludos</h4>
      <div class="chips">
        <div class="chip"><b>Hello / Hi / Hey</b> → Hola</div>
        <div class="chip"><b>How are you?</b> → ¿Cómo estás?</div>
        <div class="chip"><b>What's up?</b> → ¿Qué tal?</div>
        <div class="chip"><b>How is it going?</b> → ¿Qué andas?</div>
        <div class="chip"><b>What's new?</b> → ¿Qué hay de nuevo?</div>
        <div class="chip"><b>Good morning / afternoon / evening</b> → Buenos días / tardes / noches</div>
      </div>
      <h4 class="sub">Despedidas</h4>
      <div class="chips">
        <div class="chip"><b>Bye / Goodbye</b> → Adiós</div>
        <div class="chip"><b>See you / See you later</b> → Nos vemos / Hasta luego</div>
        <div class="chip"><b>See you tomorrow</b> → Hasta mañana</div>
        <div class="chip"><b>Have a nice day</b> → Que tengas bonito día</div>
        <div class="chip"><b>Take care</b> → Cuídate</div>
        <div class="chip"><b>Talk to you later</b> → Luego te hablo</div>
      </div>
      <h4 class="sub">Mini diálogo</h4>
      <div class="ex"><div class="en">A: Hi! How are you? — B: I'm fine, thanks. What about you?</div></div>
      <div class="ex"><div class="en">A: What's up? — B: Nothing much, just studying English.</div></div>
      <div class="ex"><div class="en">A: I have to go now. — B: Ok, take care! See you tomorrow.</div></div>
      <div class="note"><b>Tip:</b> "How are you?" es más formal; "What's up?" y "How's it going?" son informales, entre amigos.</div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>A / An — "un, una"</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <p>Se usan antes de un sustantivo singular no específico. La regla depende del <b>sonido</b> con el que empieza la palabra, no de la letra.</p>
      <div class="eli5"><span class="tag">Explicación simple</span>Di la palabra en voz alta. Si al empezar a decirla tu boca hace sonido de vocal (a-e-i-o-u), usas <b>an</b>. Si no, usas <b>a</b>. Es solo cuestión de cómo suena, no de cómo se escribe.</div>
      <table class="gram">
        <tr><th>Usa A</th><th>Usa AN</th></tr>
        <tr><td class="en">a cat, a dog, a table, a car, a house</td><td class="en">an apple, an elephant, an airplane, an ocean, an umbrella</td></tr>
      </table>
      <div class="note"><b>Truco:</b> "AN" se usa cuando la palabra empieza con sonido de vocal (a, e, i, o, u).</div>
      <div class="quiz">
        <p class="quiz-title">Practica</p>
        <div class="q"><p class="stem">___ umbrella</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,false,'r0b')">a</button>
            <button class="opt" onclick="checkAnswer(this,true,'r0b')">an</button>
          </div>
        </div>
        <div class="q"><p class="stem">___ dog</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r0b')">a</button>
            <button class="opt" onclick="checkAnswer(this,false,'r0b')">an</button>
          </div>
        </div>
        <p class="quiz-result" id="r0b"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>The — "el, la, los, las"</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <p><b>THE</b> se pronuncia <span style="font-family:'JetBrains Mono',monospace">/de/</span> antes de consonante y <span style="font-family:'JetBrains Mono',monospace">/di/</span> antes de vocal.</p>
      <div class="eli5"><span class="tag">Explicación simple</span>Piensa en "the" como señalar con el dedo: lo usas cuando tú y la otra persona ya saben exactamente de qué (o quién) están hablando. Si hablas de algo en general, sin señalar nada en particular, no lo uses.</div>
      <div class="ex"><div class="en">The water of this river is very clean.</div><div class="es">(Específico: el agua de este río)</div></div>
      <div class="ex"><div class="en">Water is very good for your health.</div><div class="es">(General: el agua en general, sin "the")</div></div>
      <div class="ex"><div class="en">The children are playing in the park.</div><div class="es">(Específico: esos niños)</div></div>
      <div class="ex"><div class="en">Children love video games.</div><div class="es">(General: los niños en general)</div></div>
      <div class="note">Regla de oro: usa <b>THE</b> cuando hablas de algo específico y ya identificado. Omítelo cuando hablas en general.</div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">___ dogs are loyal animals. (hablando en general)</p>

            <button class="opt" onclick="checkAnswer(this,true,'r0t')">(sin artículo) Dogs</button>
          </div>
        </div>
        <div class="q"><p class="stem">Look at ___ dog in the garden. (ese perro específico)</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r0t')">the</button>
            <button class="opt" onclick="checkAnswer(this,false,'r0t')">a</button>
          </div>
        </div>
        <p class="quiz-result" id="r0t"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>This / That / These / Those</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Imagina que tienes algo en la mano (this/these) y algo lejos, al otro lado del cuarto (that/those). Y si es una sola cosa, usas this/that; si son varias cosas, these/those. ¡Así de simple!</div>
      <table class="gram">
        <tr><th>Inglés</th><th>Español</th><th>Cuándo</th></tr>
        <tr><td class="en">This</td><td class="es">Este / Esta</td><td class="es">Singular, cerca de ti</td></tr>
        <tr><td class="en">These</td><td class="es">Estos / Estas</td><td class="es">Plural, cerca de ti</td></tr>
        <tr><td class="en">That</td><td class="es">Ese / Esa</td><td class="es">Singular, lejos de ti</td></tr>
        <tr><td class="en">Those</td><td class="es">Esos / Esas</td><td class="es">Plural, lejos de ti</td></tr>
      </table>
      <div class="ex"><div class="en">What's this? — This is an eraser.</div></div>
      <div class="ex"><div class="en">What's that? — That is a school bag.</div></div>
      <div class="ex"><div class="en">What are these? — These are books.</div></div>
      <div class="ex"><div class="en">What are those? — Those are keys.</div></div>
      <div class="ex"><div class="en">Is this your bag? — No, that's not mine, this one is.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Señalando dos libros lejos de ti: "___ books are interesting."</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,false,'r0d')">These</button>
            <button class="opt" onclick="checkAnswer(this,true,'r0d')">Those</button>
          </div>
        </div>
        <p class="quiz-result" id="r0d"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>

<script>
LEVELS.push({
  title:"Verbo To Be",
  eyebrow:"Nivel 1 · Presente — el verbo más importante",
  intro:"El verbo \"to be\" (ser/estar) es la base de casi todas las presentaciones y descripciones. Domínalo y podrás decir quién eres, de dónde eres y cómo eres.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Formas afirmativas y contracciones</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>"To be" significa "ser" o "estar" — en inglés es UN SOLO verbo para los dos. Imagina que cada persona (yo, tú, él...) tiene su propia "palabra amiga" que siempre la acompaña: yo va con <b>am</b>, tú/nosotros/ellos van con <b>are</b>, y él/ella/eso van con <b>is</b>. Apréndete esas tres parejas y ya sabes lo más importante.</div>
      <table class="gram">
        <tr><th>Sujeto</th><th>Verbo be</th><th>Contracción</th><th>Español</th></tr>
        <tr><td class="en">I</td><td class="en">am</td><td class="en">I'm</td><td class="es">yo soy/estoy</td></tr>
        <tr><td class="en">You</td><td class="en">are</td><td class="en">You're</td><td class="es">tú eres/estás</td></tr>
        <tr><td class="en">He</td><td class="en">is</td><td class="en">He's</td><td class="es">él es/está</td></tr>
        <tr><td class="en">She</td><td class="en">is</td><td class="en">She's</td><td class="es">ella es/está</td></tr>
        <tr><td class="en">It</td><td class="en">is</td><td class="en">It's</td><td class="es">eso es/está (cosas/animales)</td></tr>
        <tr><td class="en">We</td><td class="en">are</td><td class="en">We're</td><td class="es">nosotros somos/estamos</td></tr>
        <tr><td class="en">They</td><td class="en">are</td><td class="en">They're</td><td class="es">ellos son/están</td></tr>
      </table>
      <div class="note"><b>Fórmula:</b> Sujeto + verb be + complemento → <i>I am drinking coffee.</i></div>
      <div class="ex"><div class="en">I am a student. / You are my friend. / She is happy.</div></div>
      <div class="ex"><div class="en">We are ready. / They are at home. / It is raining.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">My parents ___ doctors.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,false,'r1x')">is</button>
            <button class="opt" onclick="checkAnswer(this,true,'r1x')">are</button>
          </div>
        </div>
        <div class="q"><p class="stem">My sister ___ a nurse.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r1x')">is</button>
            <button class="opt" onclick="checkAnswer(this,false,'r1x')">are</button>
          </div>
        </div>
        <p class="quiz-result" id="r1x"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Negativo y preguntas (sí/no)</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <h4 class="sub">Negativo</h4>
      <div class="eli5"><span class="tag">Explicación simple</span>Para decir que algo NO es así, solo agrega la palabra <b>not</b> justo después de am/is/are. Y para preguntar, simplemente cambias el orden: pones el verbo be primero, como cuando en español dirías "¿Eres tú...?" en vez de "Tú eres...".</div>
      <div class="ex"><div class="en">Sujeto + verb be + not + complemento</div><div class="es">I am not drinking coffee.</div></div>
      <h4 class="sub">Pregunta sí/no</h4>
      <div class="ex"><div class="en">Verb be + sujeto + complemento?</div><div class="es">Am I drinking coffee?</div></div>
      <div class="ex"><div class="en">I am not tired. / She isn't from Spain. / They aren't married.</div></div>
      <div class="ex"><div class="en">Are you a teacher? — No, I'm not, I'm an engineer.</div></div>
      <table class="gram">
        <tr><th>Pregunta</th><th>Respuesta corta (+)</th><th>Respuesta corta (−)</th></tr>
        <tr><td class="en">Are you...?</td><td class="en">Yes, I am</td><td class="en">No, I'm not</td></tr>
        <tr><td class="en">Is he/she...?</td><td class="en">Yes, he/she is</td><td class="en">No, he/she isn't</td></tr>
        <tr><td class="en">Are we/they...?</td><td class="en">Yes, we/they are</td><td class="en">No, we/they aren't</td></tr>
      </table>
      <div class="quiz">
        <p class="quiz-title">Practica</p>
        <div class="q"><p class="stem">Is he a pilot? (respuesta larga afirmativa)</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r1a')">Yes, he is a pilot.</button>
            <button class="opt" onclick="checkAnswer(this,false,'r1a')">Yes, he are a pilot.</button>
          </div>
        </div>
        <p class="quiz-result" id="r1a"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Wh-questions</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Estas cuatro palabritas (who, what, where, when) son como llaves: cada una abre un tipo distinto de información. Who = personas, What = cosas, Where = lugares, When = tiempo. Siempre van al principio de la pregunta.</div>
      <table class="gram">
        <tr><th>Palabra</th><th>Significa</th><th>Fórmula</th><th>Ejemplo</th></tr>
        <tr><td class="en">Who</td><td class="es">quién</td><td class="es">who + verb be + complemento</td><td class="en">Who is working on Saturday?</td></tr>
        <tr><td class="en">What</td><td class="es">qué</td><td class="es">what + verb be + sujeto</td><td class="en">What is that box?</td></tr>
        <tr><td class="en">Where</td><td class="es">dónde</td><td class="es">where + verb be + sujeto</td><td class="en">Where is it?</td></tr>
        <tr><td class="en">When</td><td class="es">cuándo</td><td class="es">when + verb be + complemento</td><td class="en">When is the party?</td></tr>
      </table>
      <div class="note">A diferencia de las preguntas sí/no, estas no tienen una respuesta corta fija: se responde con la información pedida.</div>
      <div class="ex"><div class="en">Who is she? — She's my sister, Ana.</div></div>
      <div class="ex"><div class="en">What's your name? — My name's Yinette.</div></div>
      <div class="ex"><div class="en">Where are you from? — I'm from Venezuela.</div></div>
      <div class="ex"><div class="en">When is your birthday? — It's in October.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">___ is that girl? — She's my cousin.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r1w')">Who</button>
            <button class="opt" onclick="checkAnswer(this,false,'r1w')">What</button>
          </div>
        </div>
        <p class="quiz-result" id="r1w"></p>
      </div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Adjetivos y pronombres posesivos</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <table class="gram">
        <tr><th>Sujeto</th><th>Adjetivo posesivo</th><th>Ejemplo</th><th>Pronombre posesivo</th></tr>
        <tr><td class="en">I</td><td class="en">my</td><td class="en">My name is Yinette</td><td class="en">mine</td></tr>
        <tr><td class="en">You</td><td class="en">your</td><td class="en">Your name is María</td><td class="en">yours</td></tr>
        <tr><td class="en">She</td><td class="en">her</td><td class="en">This is her phone</td><td class="en">hers</td></tr>
        <tr><td class="en">He</td><td class="en">his</td><td class="en">This is his phone</td><td class="en">his</td></tr>
        <tr><td class="en">They</td><td class="en">their</td><td class="en">He likes their movie</td><td class="en">theirs</td></tr>
        <tr><td class="en">We</td><td class="en">our</td><td class="en">This is our time</td><td class="en">ours</td></tr>
        <tr><td class="en">It</td><td class="en">its</td><td class="en">This is its toy</td><td class="en">-</td></tr>
      </table>
      <div class="ex"><div class="en">This is my house. (adjetivo posesivo, va con sustantivo)</div></div>
      <div class="ex"><div class="en">This house is mine. (pronombre posesivo, va solo, al final)</div></div>
      <h4 class="sub">Presentar a alguien</h4>
      <div class="chips">
        <div class="chip">This is Luis.</div>
        <div class="chip">Luis, this is Mary.</div>
        <div class="chip">Mary, do you know Andrés?</div>

      </div>
      <div class="ex"><div class="en">A: Mary, this is my friend Luis. — B: Nice to meet you, Luis! — Luis: Pleased to meet you too!</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">This bike is not yours, it's ___ (de él).</p>
          <div class="opts">

            <button class="opt" onclick="checkAnswer(this,false,'r1p')">him</button>
          </div>
        </div>
        <p class="quiz-result" id="r1p"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>

<script>

  title:"Presente Simple",
  eyebrow:"Nivel 4 · Tiempo verbal — rutinas y hechos",
  intro:"El presente simple describe rutinas, hábitos y hechos generales (no lo que pasa ahora mismo). Usa los auxiliares DO / DOES.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Cuándo se usa</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <p>Se usa para: rutinas (<i>I wake up at 6</i>), hábitos (<i>She works on Mondays</i>), hechos generales (<i>Water boils at 100°C</i>) y gustos (<i>They like pizza</i>).</p>
      <div class="eli5"><span class="tag">Explicación simple</span>Este tiempo es para las cosas que haces "siempre", como un horario o una costumbre — no importa el momento exacto, es algo que se repite. Si puedes decir "yo siempre..." o "yo normalmente...", ¡es presente simple!</div>
      <div class="chips">
        <div class="chip">always — siempre</div><div class="chip">usually — usualmente</div><div class="chip">often — frecuentemente</div>
        <div class="chip">sometimes — a veces</div><div class="chip">never — nunca</div><div class="chip">every day/week — cada día/semana</div>
      </div>
      <div class="ex"><div class="en">I usually wake up at 6 am and go to work.</div></div>
      <div class="ex"><div class="en">She never eats breakfast.</div></div>
      <div class="ex"><div class="en">The sun rises in the east.</div></div>
      <div class="note"><b>Posición de los adverbios de frecuencia:</b> van entre el sujeto y el verbo principal (<i>I always study</i>), pero después del verbo "to be" (<i>She is always happy</i>).</div>
    </div></div>
  </div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Auxiliares DO / DOES</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <table class="gram">
        <tr><th>DO</th><th>DOES</th></tr>
        <tr><td class="en">I / You / We / They</td><td class="en">He / She / It</td></tr>
      </table>
      <div class="note">Con <b>he/she/it</b> el verbo principal también lleva <b>-s</b> en afirmativo: <i>She work<b>s</b> on Saturdays.</i></div>
      <table class="gram">
        <tr><th></th><th>Afirmativo</th><th>Negativo</th><th>Pregunta</th></tr>
        <tr><td class="es">I/You/We/They</td><td class="en">I work</td><td class="en">I don't work</td><td class="en">Do you work?</td></tr>
        <tr><td class="es">He/She/It</td><td class="en">She works</td><td class="en">She doesn't work</td><td class="en">Does she work?</td></tr>

<script>

  title:"Presente Continuo",

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Formación: am/is/are + verbo-ing</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Este tiempo es para lo que está pasando "justo ahora, mientras hablas". La palabra clave es <b>-ing</b> al final del verbo (como "-ando" o "-iendo" en español: comiendo, corriendo). Si puedes señalar algo y decir "mira, está pasando ahora", es presente continuo.</div>
      <table class="gram">
        <tr><th></th><th>Afirmativo</th><th>Negativo</th><th>Pregunta</th></tr>
        <tr><td class="es">I</td><td class="en">I am eating</td><td class="en">I'm not eating</td><td class="en">Am I eating?</td></tr>
        <tr><td class="es">He/She/It</td><td class="en">He is eating</td><td class="en">He isn't eating</td><td class="en">Is he eating?</td></tr>
        <tr><td class="es">You/We/They</td><td class="en">They are eating</td><td class="en">They aren't eating</td><td class="en">Are they eating?</td></tr>
      </table>
      <div class="note"><b>Señales de tiempo:</b> now, right now, at the moment, look!, listen! → <i>I am drinking coffee right now.</i></div>
      <h4 class="sub">Reglas de ortografía del -ing</h4>
      <div class="chips">
        <div class="chip">work → work<b>ing</b></div>
        <div class="chip">write → writ<b>ing</b> (quita la -e)</div>
        <div class="chip">run → runn<b>ing</b> (dobla consonante final)</div>
      </div>
      <div class="ex"><div class="en">Look! The baby is sleeping.</div></div>
      <div class="ex"><div class="en">They are building a new mall near my house.</div></div>
      <div class="ex"><div class="en">I'm not working today, I'm on vacation.</div></div>
      <div class="ex"><div class="en">Are you listening to me?</div></div>

        <p class="quiz-title">Practica</p>

          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r5a')">is studying</button>

    </div></div>

  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Presente Simple vs. Presente Continuo</h3><span class="chev">›</span></button>

        <tr><th>Presente Simple</th><th>Presente Continuo</th></tr>

  </div>
  `
});
</script>

<script>

  title:"Presente Perfecto",
  eyebrow:"Nivel 6 · Tiempo verbal — el pasado que conecta con hoy",
  intro:"Habla de experiencias de vida y acciones pasadas cuyo resultado importa ahora, sin decir exactamente cuándo pasaron.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Formación: have/has + participio pasado</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Este es el tiempo más difícil de "sentir" para hispanohablantes porque no decimos cuándo pasó algo, solo que pasó y todavía importa hoy. Piensa: "he comido" en español — no dices cuándo comiste, solo que ya comiste y por eso no tienes hambre ahora. Es exactamente esa idea.</div>
      <table class="gram">
        <tr><th>Sujeto</th><th>Auxiliar</th><th>Ejemplo</th></tr>
        <tr><td class="en">I/You/We/They</td><td class="en">have</td><td class="en">I have visited Japan.</td></tr>
        <tr><td class="en">He/She/It</td><td class="en">has</td><td class="en">She has finished her homework.</td></tr>
      </table>
      <div class="ex"><div class="en">Negativo: I haven't visited Japan. / She hasn't finished.</div></div>
      <div class="ex"><div class="en">Pregunta: Have you visited Japan? / Has she finished?</div></div>
      <div class="note">Con verbos regulares el participio es igual al pasado (<b>-ed</b>: worked, finished). Con irregulares hay que memorizarlo: <b>been</b> (be), <b>gone</b> (go), <b>eaten</b> (eat), <b>seen</b> (see), <b>done</b> (do), <b>made</b> (make).</div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Palabras clave</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="chips">
        <div class="chip"><b>ever</b> — alguna vez</div><div class="chip"><b>never</b> — nunca</div>
        <div class="chip"><b>already</b> — ya</div><div class="chip"><b>yet</b> — todavía (negativo/pregunta)</div>
        <div class="chip"><b>just</b> — justo/recién</div><div class="chip"><b>since</b> — desde (un punto: since 2020)</div>
        <div class="chip"><b>for</b> — durante (una duración: for 3 years)</div>
      </div>
      <div class="ex"><div class="en">Have you ever eaten sushi? — Yes, I have. / No, I never have.</div></div>
      <div class="ex"><div class="en">I have already finished the report.</div></div>
      <div class="ex"><div class="en">I haven't finished it yet.</div></div>
      <div class="ex"><div class="en">I have known her since 2015. / I have lived here for two years.</div></div>
      <div class="ex"><div class="en">Have you ever tried Thai food? — No, I've never tried it.</div></div>
      <div class="ex"><div class="en">He has just arrived. / They have just left.</div></div>
      <div class="ex"><div class="en">I've already seen that movie twice.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">She ___ never ___ (be) to Europe.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r6a')">has / been</button>
            <button class="opt" onclick="checkAnswer(this,false,'r6a')">have / be</button>

</script>

  <div class="topic">

        <tr><th>Sujeto</th><th>Pasado</th></tr>
        <tr><td class="en">I / He / She / It</td><td class="en">was</td></tr>
        <tr><td class="en">You / We / They</td><td class="en">were</td></tr>
      </table>
      <div class="ex"><div class="en">I was at home yesterday. / They were at school.</div></div>
      <div class="ex"><div class="en">Negativo: I wasn't at home. / They weren't at school.</div></div>
      <div class="ex"><div class="en">Pregunta: Were you at home? — Yes, I was. / No, I wasn't.</div></div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Verbos regulares e irregulares</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <p><b>Regulares:</b> se les agrega <b>-ed</b>: work → work<b>ed</b>, play → play<b>ed</b>, study → stud<b>ied</b>.</p>
      <p><b>Irregulares:</b> cambian de forma, hay que memorizarlos. Algunos comunes:</p>
      <table class="gram">
        <tr><th>Presente</th><th>Pasado</th><th>Presente</th><th>Pasado</th></tr>
        <tr><td class="en">go</td><td class="en">went</td><td class="en">have</td><td class="en">had</td></tr>
        <tr><td class="en">eat</td><td class="en">ate</td><td class="en">see</td><td class="en">saw</td></tr>
        <tr><td class="en">do</td><td class="en">did</td><td class="en">make</td><td class="en">made</td></tr>
        <tr><td class="en">buy</td><td class="en">bought</td><td class="en">come</td><td class="en">came</td></tr>
        <tr><td class="en">take</td><td class="en">took</td><td class="en">give</td><td class="en">gave</td></tr>
        <tr><td class="en">write</td><td class="en">wrote</td><td class="en">say</td><td class="en">said</td></tr>
        <tr><td class="en">think</td><td class="en">thought</td><td class="en">know</td><td class="en">knew</td></tr>
      </table>
      <div class="note"><b>Negativo y pregunta:</b> con <b>didn't</b> + verbo base (sin -ed): <i>I didn't go. / Did you go?</i></div>
      <div class="ex"><div class="en">Last year, I traveled to Colombia and visited my grandmother.</div></div>
      <div class="ex"><div class="en">Did you study yesterday? — Yes, I did. / No, I didn't.</div></div>
      <div class="ex"><div class="en">We watched a movie and then we ate pizza.</div></div>
      <div class="ex"><div class="en">What time did you wake up this morning? — I woke up at 7.</div></div>
      <div class="ex"><div class="en">She didn't have time to finish her homework.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>

<script>
LEVELS.push({
  title:"Pasado Continuo y Perfecto",
  eyebrow:"Nivel 8 · Tiempos verbales — el pasado con más detalle",
  intro:"Dos formas de dar profundidad al pasado: una acción en progreso interrumpida, y una acción anterior a otra en el pasado.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Pasado Continuo: was/were + verbo-ing</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Imagina una película en pausa: en cierto momento del pasado, algo estaba "en proceso", como una fotografía de la acción a la mitad. Muchas veces esa acción es interrumpida por otra cosa que pasó de repente.</div>
      <p>Describe una acción en progreso en un momento del pasado, muchas veces interrumpida por otra.</p>
      <table class="gram">
        <tr><th>Sujeto</th><th>Forma</th></tr>
        <tr><td class="en">I / He / She / It</td><td class="en">was + verb-ing</td></tr>
        <tr><td class="en">You / We / They</td><td class="en">were + verb-ing</td></tr>
      </table>
      <div class="ex"><div class="en">I was cooking when the phone rang.</div><div class="es">Estaba cocinando cuando sonó el teléfono. (cocinar se interrumpió)</div></div>
      <div class="ex"><div class="en">They were watching TV while she was studying.</div><div class="es">Ellos estaban viendo tele mientras ella estudiaba. (dos acciones al mismo tiempo)</div></div>
      <div class="ex"><div class="en">I was sleeping at midnight.</div><div class="es">Estaba durmiendo a medianoche. (foto de un momento exacto)</div></div>
      <div class="ex"><div class="en">She was walking to work when it started to rain.</div><div class="es">Iba caminando al trabajo cuando empezó a llover.</div></div>
      <div class="ex"><div class="en">What were you doing at 8pm yesterday?</div><div class="es">¿Qué estabas haciendo ayer a las 8pm?</div></div>
      <div class="note"><b>Fórmula:</b> was/were + verbo-ing. Se combina con <b>when</b> (cuando, para la acción que interrumpe) y <b>while</b> (mientras, para dos acciones simultáneas).</div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">I ___ (drive) when I saw the accident.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r8a')">was driving</button>
            <button class="opt" onclick="checkAnswer(this,false,'r8a')">drove</button>
          </div>
        </div>
        <p class="quiz-result" id="r8a"></p>
      </div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Pasado Perfecto: had + participio</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Cuando cuentas dos cosas del pasado, y una pasó ANTES que la otra, usa este tiempo para la que pasó primero (la "más pasada"). Es como decir "ya había pasado" en español — exactamente la misma idea.</div>
      <p>Habla de una acción que ya había pasado antes de otro momento en el pasado.</p>
      <div class="ex"><div class="en">When I arrived, they had already left.</div><div class="es">Cuando llegué, ellos ya se habían ido. (se fueron primero, luego llegué yo)</div></div>
      <div class="ex"><div class="en">She had never traveled abroad before that trip.</div><div class="es">Ella nunca había viajado al extranjero antes de ese viaje.</div></div>
      <div class="ex"><div class="en">I had finished my homework before dinner.</div><div class="es">Ya había terminado la tarea antes de la cena.</div></div>
      <div class="ex"><div class="en">By the time the movie started, we had already eaten.</div><div class="es">Para cuando empezó la película, ya habíamos comido.</div></div>
      <div class="ex"><div class="en">He was tired because he hadn't slept well.</div><div class="es">Estaba cansado porque no había dormido bien.</div></div>
      <div class="note">Es el mismo orden de ideas que el presente perfecto (have/has + participio), pero todo movido un paso más atrás en el tiempo: <b>had</b> + participio, igual para todos los sujetos.</div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">By the time I got home, my mom ___ (cook) dinner.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r8b')">had cooked</button>
            <button class="opt" onclick="checkAnswer(this,false,'r8b')">cooked</button>
          </div>
        </div>
        <p class="quiz-result" id="r8b"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>
<!-- NIVEL 9 -->
<script>
LEVELS.push({
  title:"Futuro",
  eyebrow:"Nivel 9 · Tiempos verbales — lo que va a pasar",
  intro:"En español usamos casi siempre la misma forma para hablar del futuro. En inglés hay que elegir entre dos formas según qué tan decidido está el plan. Vamos con calma, paso a paso.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Will — decisiones espontáneas y predicciones</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Imagina que estás hablando y, en ese mismo instante, decides algo o adivinas algo. Para eso usamos <b>will</b>. Es como decir "se me acaba de ocurrir" o "yo creo que...". No lo planeaste antes, lo decides en el momento en que hablas.</div>
      <h4 class="sub">1. Para decisiones que tomas en el momento</h4>
      <div class="ex"><div class="en">The phone is ringing. — I will answer it!</div><div class="es">El teléfono está sonando. — ¡Yo contesto! (lo decides ahora mismo)</div></div>
      <div class="ex"><div class="en">I'm thirsty. I will drink some water.</div><div class="es">Tengo sed. Voy a tomar agua. (decisión espontánea)</div></div>
      <div class="ex"><div class="en">Don't worry, I will help you with your homework.</div><div class="es">No te preocupes, te ayudaré con la tarea.</div></div>
      <h4 class="sub">2. Para predicciones, opiniones sobre el futuro</h4>
      <div class="ex"><div class="en">It will rain tomorrow.</div><div class="es">Mañana va a llover. (es tu opinión/predicción, no tienes evidencia física ahora)</div></div>
      <div class="ex"><div class="en">I think you will love this movie.</div><div class="es">Creo que te va a encantar esta película.</div></div>
      <div class="ex"><div class="en">In the future, robots will do most of the housework.</div><div class="es">En el futuro, los robots harán la mayoría de las tareas del hogar.</div></div>
      <h4 class="sub">3. Para promesas y ofrecimientos</h4>
      <div class="ex"><div class="en">I will always love you.</div><div class="es">Siempre te amaré. (promesa)</div></div>
      <div class="ex"><div class="en">I'll carry your bags for you.</div><div class="es">Te cargo las bolsas. (ofrecimiento, ayuda espontánea)</div></div>
      <table class="gram">
        <tr><th>Forma</th><th>Ejemplo</th></tr>
        <tr><td class="es">Afirmativo</td><td class="en">I will go. / I'll go.</td></tr>
        <tr><td class="es">Negativo</td><td class="en">I will not go. / I won't go.</td></tr>
        <tr><td class="es">Pregunta</td><td class="en">Will you go? — Yes, I will. / No, I won't.</td></tr>
      </table>
      <div class="note"><b>Fórmula:</b> sujeto + will + verbo base (sin "to", sin -s, sin -ing). Es igual para todos los sujetos: I will, you will, he will, we will, they will — nunca cambia.</div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Suena el timbre y decides en ese momento abrir la puerta:</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r9w')">I'll open the door.</button>
            <button class="opt" onclick="checkAnswer(this,false,'r9w')">I'm going to open the door.</button>
          </div>
        </div>
        <div class="q"><p class="stem">Es solo tu opinión sobre el futuro lejano: "I think it ___ be a good year."</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r9w')">will</button>
            <button class="opt" onclick="checkAnswer(this,false,'r9w')">is going to</button>
          </div>
        </div>
        <p class="quiz-result" id="r9w"></p>
      </div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Going to — planes ya decididos</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Ahora imagina lo contrario: ya lo pensaste antes, ya lo decidiste, ya tienes el plan armado. Para eso usamos <b>going to</b>. También se usa cuando ves algo ahora mismo (como nubes negras) y por eso sabes lo que va a pasar — no es una simple opinión, ¡es evidencia!</div>
      <h4 class="sub">1. Para planes que ya decidiste antes</h4>
      <div class="ex"><div class="en">I am going to study English next year.</div><div class="es">Voy a estudiar inglés el próximo año. (ya lo decidiste, es un plan)</div></div>
      <div class="ex"><div class="en">We are going to have a party this weekend.</div><div class="es">Vamos a hacer una fiesta este fin de semana. (ya está organizado)</div></div>
      <div class="ex"><div class="en">She is going to buy a new car.</div><div class="es">Ella va a comprar un carro nuevo. (ya lo decidió)</div></div>
      <h4 class="sub">2. Para predicciones con evidencia visible AHORA</h4>
      <div class="ex"><div class="en">Look at those clouds! It's going to rain.</div><div class="es">¡Mira esas nubes! Va a llover. (lo ves ahora mismo, no es solo opinión)</div></div>
      <div class="ex"><div class="en">Watch out! That glass is going to fall!</div><div class="es">¡Cuidado! ¡Ese vaso se va a caer! (lo estás viendo pasar)</div></div>
      <div class="ex"><div class="en">He's driving too fast, he's going to have an accident.</div><div class="es">Está manejando muy rápido, va a tener un accidente.</div></div>
      <table class="gram">
        <tr><th>Forma</th><th>Ejemplo</th></tr>
        <tr><td class="es">Afirmativo</td><td class="en">I am going to travel.</td></tr>
        <tr><td class="es">Negativo</td><td class="en">I am not going to travel.</td></tr>
        <tr><td class="es">Pregunta</td><td class="en">Are you going to travel? — Yes, I am. / No, I'm not.</td></tr>
      </table>
      <div class="note"><b>Fórmula:</b> sujeto + am/is/are (según el sujeto) + going to + verbo base.</div>
      <div class="note"><b>Truco fácil para recordar la diferencia:</b> Will = "se me ocurre ahora". Going to = "ya lo tenía pensado" o "lo estoy viendo pasar ahora mismo".</div>
      <h4 class="sub">Comparación directa</h4>
      <table class="gram">
        <tr><th>Situación</th><th>Will</th><th>Going to</th></tr>
        <tr><td class="es">Decides en el momento</td><td class="en">I'll get it! (suena el teléfono)</td><td class="en">—</td></tr>
        <tr><td class="es">Plan ya organizado</td><td class="en">—</td><td class="en">I'm going to visit my mom this weekend.</td></tr>
        <tr><td class="es">Predicción, sin evidencia</td><td class="en">I think she will win.</td><td class="en">—</td></tr>
        <tr><td class="es">Predicción, con evidencia ahora</td><td class="en">—</td><td class="en">Look, she's going to win! (va ganando ya)</td></tr>
      </table>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Ya reservamos el vuelo. → We ___ travel to Peru in June.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r9a')">are going to</button>
            <button class="opt" onclick="checkAnswer(this,false,'r9a')">will</button>
          </div>
        </div>
        <div class="q"><p class="stem">Ves el carro a punto de chocar contra el poste, dices:</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r9a')">It's going to crash!</button>

          </div>
        </div>
        <div class="q"><p class="stem">¿Cuáles son tus planes de vacaciones? (ya decidido)</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r9a')">I'm going to visit my grandparents.</button>
            <button class="opt" onclick="checkAnswer(this,false,'r9a')">I will visit my grandparents.</button>
          </div>
        </div>
        <p class="quiz-result" id="r9a"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>

  title:"Presente Perfecto Continuo",

LEVELS.push({
  title:"Futuro Continuo y Perfecto",

  intro:"Dos formas más de hablar del futuro: una acción en progreso en un momento futuro, y una acción que estará terminada antes de cierto punto.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Futuro Continuo: will be + verbo-ing</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Imagina que apuntas a un momento exacto en el futuro y describes qué estarás haciendo justo en ese instante — como tomar una foto de tu vida mañana a esa hora.</div>

  <div class="topic">

      <div class="eli5"><span class="tag">Explicación simple</span>Este te ayuda a decir "para tal fecha, ya habré terminado esto". Es como poner una fecha límite y decir que la acción estará lista antes de llegar a ella.</div>

});

<script>
LEVELS.push({
  title:"Verbos Modales",
  eyebrow:"Nivel 13 · Gramática avanzada — permiso, obligación y posibilidad",
  intro:"Los modales cambian el significado del verbo principal: capacidad, permiso, obligación, consejo o probabilidad. No llevan -s, -ing ni 'to' después.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Can / Could — capacidad y permiso</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>"Can" es "puedo", así de simple — para decir que sabes hacer algo o para pedir permiso de forma normal. "Could" es la versión más suave y educada, como decir "¿podrías...?" en vez de "¿puedes...?".</div>
      <div class="ex"><div class="en">I can swim very well. (capacidad presente)</div></div>
      <div class="ex"><div class="en">Can I go to the restroom? (permiso, informal)</div></div>
      <div class="ex"><div class="en">Could you help me, please? (petición más educada)</div></div>
      <div class="ex"><div class="en">When I was a child, I could run very fast. (capacidad pasada)</div></div>
      <div class="ex"><div class="en">Can you speak Italian? — No, but I can speak French.</div></div>
      <div class="ex"><div class="en">Could I borrow your pen for a second?</div></div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Must / Have to — obligación</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>"Must" y "have to" significan "debo/tengo que" — pero ojo con el negativo: "mustn't" es una prohibición (¡no lo hagas, está prohibido!), mientras que "don't have to" solo significa que no es necesario (puedes hacerlo o no, tú decides).</div>
      <div class="ex"><div class="en">You must wear a seatbelt. (regla/obligación fuerte, a menudo impuesta por quien habla)</div></div>
      <div class="ex"><div class="en">I have to finish this report today. (obligación externa)</div></div>
      <div class="ex"><div class="en">You mustn't smoke here. (prohibición)</div></div>
      <div class="ex"><div class="en">You don't have to come if you don't want to. (no es necesario, no obligatorio)</div></div>
      <div class="ex"><div class="en">Do we have to bring our own food? — No, you don't have to.</div></div>
      <div class="note"><b>Diferencia clave:</b> "mustn't" = prohibido; "don't have to" = no es necesario. ¡No son sinónimos!</div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Should / Might / May — consejo y posibilidad</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>"Should" es un consejo amistoso, como cuando un amigo te dice "deberías...". "Might" es "tal vez", cuando no estás nada seguro. "May" es una forma elegante y formal de pedir permiso.</div>
      <div class="ex"><div class="en">You should study more. (consejo)</div></div>
      <div class="ex"><div class="en">It might rain later. (posibilidad, no muy seguro)</div></div>
      <div class="ex"><div class="en">May I come in? (permiso formal)</div></div>
      <div class="ex"><div class="en">You shouldn't eat so much sugar. (consejo negativo)</div></div>
      <div class="ex"><div class="en">She might be at home, or she might be at work — I'm not sure.</div></div>
      <div class="ex"><div class="en">May I ask you a question?</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Es una regla del colegio, obligatorio: Students ___ wear a uniform.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r13a')">must</button>
            <button class="opt" onclick="checkAnswer(this,false,'r13a')">might</button>

        <div class="q"><p class="stem">Le doy un consejo a mi amigo: You ___ see a doctor.</p>
          <div class="opts">

            <button class="opt" onclick="checkAnswer(this,false,'r13a')">can</button>
          </div>
        </div>
        <p class="quiz-result" id="r13a"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>

LEVELS.push({
  title:"Comparativos y Superlativos",

  intro:"Cómo decir que algo es más, menos, o lo más/menos de todo un grupo.",

<script>
LEVELS.push({
  title:"Voz Pasiva",

  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Formación: be + participio</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Normalmente decimos "Juan rompió la ventana" (quién hizo la acción primero). Pero a veces el "quién" no importa, y decimos "la ventana fue rota" — ahí lo importante es la ventana, no quién la rompió. Eso es voz pasiva: el objeto se vuelve el protagonista de la oración.</div>
      <table class="gram">
        <tr><th>Voz activa</th><th>Voz pasiva</th></tr>
        <tr><td class="en">They build houses.</td><td class="en">Houses are built.</td></tr>
        <tr><td class="en">She wrote the letter.</td><td class="en">The letter was written (by her).</td></tr>
        <tr><td class="en">They have finished the project.</td><td class="en">The project has been finished.</td></tr>
      </table>
      <div class="note"><b>Fórmula general:</b> objeto + be (conjugado en el tiempo que corresponda) + participio + (by + agente, opcional).</div>
      <div class="ex"><div class="en">This song was written in 1990.</div></div>
      <div class="ex"><div class="en">English is spoken all over the world.</div></div>

<script>
LEVELS.push({
  title:"Oraciones Condicionales",
  eyebrow:"Nivel 16 · Gramática avanzada — si esto pasa, entonces...",
  intro:"Cuatro estructuras de \"if\" para hablar de hechos generales, futuro probable, situaciones hipotéticas y pasado imposible de cambiar.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Zero y First Conditional</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Estas dos son las condicionales "reales" — cosas que de verdad pueden pasar. Zero es para reglas que SIEMPRE son ciertas (como una ley de la naturaleza). First es para algo que probablemente va a pasar en el futuro si se cumple la condición.</div>
      <table class="gram">
        <tr><th>Tipo</th><th>Fórmula</th><th>Ejemplo</th></tr>
        <tr><td class="es">Zero (hechos/reglas)</td><td class="en">If + presente, presente</td><td class="en">If you heat water, it boils.</td></tr>
        <tr><td class="es">First (futuro probable)</td><td class="en">If + presente, will + verbo</td><td class="en">If it rains, I will stay home.</td></tr>
      </table>
      <div class="ex"><div class="en">If you don't water plants, they die.</div><div class="es">Si no riegas las plantas, se mueren. (siempre es cierto)</div></div>
      <div class="ex"><div class="en">If I have time tomorrow, I will call you.</div><div class="es">Si tengo tiempo mañana, te llamaré. (es probable)</div></div>
      <div class="ex"><div class="en">If you study hard, you will pass the exam.</div><div class="es">Si estudias duro, pasarás el examen.</div></div>
      <div class="ex"><div class="en">If we don't leave now, we will miss the bus.</div><div class="es">Si no salimos ahora, perderemos el bus.</div></div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Second y Third Conditional</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Estas dos son para cosas que NO son reales. Second es para imaginar algo poco probable o imposible ahora (como ganarte la lotería). Third es para hablar de algo del pasado que ya no se puede cambiar — es un "hubiera" en español, un arrepentimiento o una situación hipotética que ya pasó.</div>
      <table class="gram">
        <tr><th>Tipo</th><th>Fórmula</th><th>Ejemplo</th></tr>
        <tr><td class="es">Second (hipotético, presente/futuro)</td><td class="en">If + pasado simple, would + verbo</td><td class="en">If I won the lottery, I would travel the world.</td></tr>
        <tr><td class="es">Third (imposible de cambiar, pasado)</td><td class="en">If + pasado perfecto, would have + participio</td><td class="en">If I had studied, I would have passed the exam.</td></tr>
      </table>
      <div class="note"><b>Second conditional:</b> con "be" se suele usar <b>were</b> para todos los sujetos (<i>If I were you...</i>).</div>
      <div class="ex"><div class="en">If I had more money, I would buy a new house.</div><div class="es">Si tuviera más dinero, compraría una casa nueva. (poco probable ahora)</div></div>
      <div class="ex"><div class="en">If I were you, I would talk to her.</div><div class="es">Si yo fuera tú, hablaría con ella. (consejo hipotético)</div></div>
      <div class="ex"><div class="en">What would you do if you saw a ghost?</div><div class="es">¿Qué harías si vieras un fantasma?</div></div>
      <div class="ex"><div class="en">If I had known you were coming, I would have cooked more.</div><div class="es">Si hubiera sabido que venías, habría cocinado más. (ya pasó, no se puede cambiar)</div></div>
      <div class="ex"><div class="en">If she hadn't missed the flight, she would have arrived on time.</div><div class="es">Si ella no hubiera perdido el vuelo, habría llegado a tiempo.</div></div>
      <h4 class="sub">Resumen visual de las 4 condicionales</h4>
      <table class="gram">
        <tr><th>Tipo</th><th>¿Cuándo?</th><th>¿Qué tan real es?</th></tr>
        <tr><td class="en">Zero</td><td class="es">Siempre</td><td class="es">100% real, una regla</td></tr>
        <tr><td class="en">First</td><td class="es">Futuro</td><td class="es">Probable, puede pasar</td></tr>
        <tr><td class="en">Second</td><td class="es">Presente/futuro</td><td class="es">Poco probable o imaginario</td></tr>
        <tr><td class="en">Third</td><td class="es">Pasado</td><td class="es">Imposible, ya no se puede cambiar</td></tr>
      </table>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">If I ___ (be) you, I would apologize.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r16a')">were</button>
            <button class="opt" onclick="checkAnswer(this,false,'r16a')">was</button>
          </div>
        </div>
        <div class="q"><p class="stem">If she had known, she ___ (help) you.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r16a')">would have helped</button>
            <button class="opt" onclick="checkAnswer(this,false,'r16a')">would help</button>
          </div>
        </div>
        <div class="q"><p class="stem">If it ___ (rain) tomorrow, we will cancel the picnic.</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r16a')">rains</button>
            <button class="opt" onclick="checkAnswer(this,false,'r16a')">will rain</button>
          </div>
        </div>
        <p class="quiz-result" id="r16a"></p>
      </div>
    </div></div>
  </div>
  `
});
</script>

  title:"Estilo Indirecto (Reported Speech)",
  eyebrow:"Nivel 17 · Gramática avanzada — contar lo que otros dijeron",
  intro:"Cuando repites lo que alguien dijo, el tiempo verbal generalmente retrocede un paso (present → past, past → past perfect).",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Cambio de tiempos verbales</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Cuando cuentas lo que alguien más dijo, todo "se mueve un pasito más atrás en el tiempo". Es como contar un chisme: si tu amiga dijo "estoy cansada" (presente), tú cuentas "ella dijo que estaba cansada" (pasado) — el tiempo retrocede un escalón.</div>
      <table class="gram">
        <tr><th>Estilo directo</th><th>Estilo indirecto</th></tr>
        <tr><td class="en">"I am tired."</td><td class="en">She said (that) she was tired.</td></tr>

        <tr><td class="en">"I have finished."</td><td class="en">She said she had finished.</td></tr>
        <tr><td class="en">"I will call you."</td><td class="en">He said he would call me.</td></tr>
      </table>
      <div class="note">También cambian palabras de tiempo/lugar: <b>now→then</b>, <b>today→that day</b>, <b>here→there</b>, <b>this→that</b>, <b>tomorrow→the next day</b>.</div>

            <button class="opt" onclick="checkAnswer(this,false,'r17a')">she is studying.</button>

        <p class="quiz-result" id="r17a"></p>
      </div>
    </div></div>
  </div>
  `
});

<!-- NIVEL 19 -->
<script>
LEVELS.push({
  title:"Conectores y Phrasal Verbs (C1-C2)",
  eyebrow:"Nivel 19 · Nivel avanzado — sonar más natural y fluido",
  intro:"Para dar el salto a un nivel avanzado necesitas conectar ideas como un hablante nativo y conocer los verbos compuestos (phrasal verbs) más comunes.",
  html:`
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Conectores para argumentar y escribir</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Estos conectores son como "puentes" entre ideas — le dan a tu inglés ese toque de fluidez, como cuando en español usas "sin embargo" o "por lo tanto" en vez de solo "pero" o "entonces" todo el tiempo.</div>
      <div class="chips">
        <div class="chip"><b>However</b> — sin embargo</div>
        <div class="chip"><b>Although / Even though</b> — aunque</div>
        <div class="chip"><b>Despite / In spite of</b> — a pesar de</div>
        <div class="chip"><b>Therefore / As a result</b> — por lo tanto</div>
        <div class="chip"><b>Moreover / Furthermore</b> — además</div>
        <div class="chip"><b>On the other hand</b> — por otro lado</div>
        <div class="chip"><b>In fact</b> — de hecho</div>
        <div class="chip"><b>Nevertheless</b> — sin embargo (más formal)</div>
      </div>
      <div class="ex"><div class="en">Despite the rain, we went to the park.</div></div>
      <div class="ex"><div class="en">I studied hard; however, I didn't pass the exam.</div></div>
      <div class="ex"><div class="en">The project was expensive. Moreover, it took longer than expected.</div></div>
      <div class="ex"><div class="en">Although he was tired, he kept working.</div><div class="es">Aunque estaba cansado, siguió trabajando.</div></div>
      <div class="ex"><div class="en">She's very talented; on the other hand, she lacks experience.</div><div class="es">Es muy talentosa; por otro lado, le falta experiencia.</div></div>
    </div></div>
  </div>
  <div class="topic">
    <button class="topic-head"><span class="dot"></span><h3>Phrasal verbs esenciales</h3><span class="chev">›</span></button>
    <div class="topic-body"><div class="topic-inner">
      <div class="eli5"><span class="tag">Explicación simple</span>Un phrasal verb es un verbo + una palabra chiquita (up, out, on...) que juntos significan algo totalmente distinto al verbo solo. Por ejemplo "give" es "dar", pero "give up" es "rendirse" — ¡nada que ver! Hay que aprenderlos como frase completa, no palabra por palabra.</div>
      <div class="chips">
        <div class="chip"><b>give up</b> — rendirse</div><div class="chip"><b>look forward to</b> — esperar con ansias</div>
        <div class="chip"><b>get along with</b> — llevarse bien con</div><div class="chip"><b>find out</b> — descubrir</div>
        <div class="chip"><b>run out of</b> — quedarse sin</div><div class="chip"><b>put off</b> — posponer</div>
        <div class="chip"><b>bring up</b> — mencionar/criar</div><div class="chip"><b>carry on</b> — continuar</div>
        <div class="chip"><b>come across</b> — encontrarse con</div><div class="chip"><b>deal with</b> — lidiar con</div>
        <div class="chip"><b>figure out</b> — resolver/entender</div><div class="chip"><b>get over</b> — superar</div>
        <div class="chip"><b>turn down</b> — rechazar</div><div class="chip"><b>show up</b> — aparecer/llegar</div>
        <div class="chip"><b>break down</b> — descomponerse/desmoronarse</div><div class="chip"><b>set up</b> — organizar/instalar</div>
      </div>
      <div class="ex"><div class="en">I'm looking forward to meeting you.</div></div>
      <div class="ex"><div class="en">Don't give up, you're doing great.</div></div>
      <div class="ex"><div class="en">We ran out of milk this morning.</div></div>
      <div class="ex"><div class="en">He turned down the job offer.</div><div class="es">Rechazó la oferta de trabajo.</div></div>
      <div class="ex"><div class="en">She didn't show up to the meeting.</div><div class="es">No se apareció a la reunión.</div></div>
      <div class="ex"><div class="en">It took me a while to get over the breakup.</div><div class="es">Me tomó tiempo superar la ruptura.</div></div>
      <div class="quiz">
        <p class="quiz-title">Practica en casa</p>
        <div class="q"><p class="stem">Aunque estaba cansado, terminó el trabajo →</p>
          <div class="opts">
            <button class="opt" onclick="checkAnswer(this,true,'r19a')">Although he was tired, he finished the work.</button>
            <button class="opt" onclick="checkAnswer(this,false,'r19a')">Despite he was tired, he finished the work.</button>
          </div>
        </div>
        <p class="quiz-result" id="r19a"></p>
      </div>
      <div class="note"><b>Ojo:</b> "despite/in spite of" van seguidos de un sustantivo o gerundio (<i>despite being tired</i>), no de una oración completa con sujeto+verbo — para eso se usa "although".</div>
    </div></div>
  </div>
  `
});

<script>

<script>
/* ================= RENDER ENGINE ================= */
function renderNav(){
  const nav = document.getElementById('levelNav');
  nav.innerHTML = LEVELS.map((lvl,i)=>`
    <li data-idx="${i}" class="${i===0?'active':''}">
      <button onclick="showLevel(${i})">
        <span class="lvl-num">${i}</span> ${lvl.title}
      </button>
    </li>
  `).join('');
}

function showLevel(i){
  document.querySelectorAll('.level-nav li').forEach((li,idx)=>{
    li.classList.toggle('active', idx===i);
  });
  const lvl = LEVELS[i];
  const page = document.getElementById('page');
  page.innerHTML = `
    <div class="hero">
      <div class="eyebrow">${lvl.eyebrow}</div>
      <h1>${lvl.title}</h1>
      <p>${lvl.intro}</p>
    </div>
    ${lvl.html}
  `;
  window.scrollTo({top:0, behavior:'smooth'});
  document.querySelector('.sidebar').classList.remove('open');
  attachTopicHandlers();
}

function attachTopicHandlers(){
  document.querySelectorAll('.topic-head').forEach(head=>{
    head.onclick = ()=>{
      const topic = head.closest('.topic');
      const body = topic.querySelector('.topic-body');
      const wasOpen = topic.classList.contains('open');
      // cerrar hermanos (acordeón)
      topic.parentElement.querySelectorAll('.topic').forEach(t=>{
        t.classList.remove('open');
        t.querySelector('.topic-body').style.maxHeight = null;
      });
      if(!wasOpen){
        topic.classList.add('open');
        body.style.maxHeight = body.scrollHeight + 60 + 'px';
      }
    };
  });
}

function checkAnswer(btn, isCorrect, resultId){
  const group = btn.closest('.opts');
  group.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('correct','wrong'); });
  btn.classList.add(isCorrect ? 'correct' : 'wrong');

  // dibujo animado flotante junto al botón
  const float = document.createElement('span');
  float.className = 'float-badge ' + (isCorrect ? 'float-good' : 'float-bad');
  float.textContent = isCorrect ? '🎉' : '🤔';
  btn.style.position = 'relative';
  btn.appendChild(float);
  setTimeout(()=>float.remove(), 900);

  const result = document.getElementById(resultId);
  if(result){
    result.textContent = isCorrect ? '✓ ¡Correcto! Muy bien.' : '✗ Casi — inténtalo otra vez.';
    result.className = 'quiz-result ' + (isCorrect ? 'good' : 'bad');
  }
}

document.addEventListener('DOMContentLoaded', ()=>{
  renderNav();
  showLevel(0);
});
</script>
